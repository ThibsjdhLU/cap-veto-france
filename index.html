<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#f7f8fc"/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="description" content="Cap Véto France : relevé de notes, bac 2027 et comparaison des concours vétérinaires publics."/>
  <title>Cap Véto France — Tableau de bord</title>
  <link rel="stylesheet" href="./styles.css"/>
  <script defer src="./app.js"></script>
  <script defer src="./sync.js"></script>
  <script defer src="./cap-v3.js"></script>
  <link rel="stylesheet" href="./cap-v3.css"/>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a class="logo" href="#accueil"><span class="logo-icon">CV</span><span><strong>Cap Véto</strong><small>Mon parcours · 2027</small></span></a>
      <nav id="navigation" aria-label="Navigation principale">
        <a data-route="accueil" class="nav-item" href="#accueil">Aujourd'hui</a>
        <a data-route="matieres" class="nav-item" href="#matieres">Mes matières</a>
        <a data-route="bac" class="nav-item" href="#bac">Objectif bac</a>
        <a data-route="suivi" class="nav-item" href="#suivi">Suivi et réglages</a>
      </nav>
      <div class="sidebar-bottom"><span class="shield">●</span><div><strong>Dossier personnel</strong><small>Notes dans ce navigateur</small></div></div>
    </aside>
    <div class="mainarea">
      <header class="topbar">
        <div class="top-breadcrumb"><button class="menu-button" aria-label="Ouvrir le menu" id="menubtn">☰</button><span>TON PARCOURS</span><span class="crumbslash">/</span><b>OBJECTIF MENTION TRÈS BIEN</b></div>
        <div class="top-actions"><span class="save-status" id="save-status">Dossier local</span><button class="icon-button" title="Importer un dossier" id="top-import">⇧</button><span class="top-avatar">CV</span></div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="footer">Cap Véto · version 3 <span>·</span> Notes officielles et simulations clairement séparées <span>·</span> Données locales</footer>
    </div>
  </div>
  <input id="importfile" type="file" accept=".json,application/json" hidden/>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
